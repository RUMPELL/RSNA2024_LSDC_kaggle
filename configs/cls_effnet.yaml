seed: 42
device: "cuda"

image_size: 380
batch_size: 16
num_workers: 4
epochs: 15
lr: 3.0e-4
weight_decay: 1.0e-4

# class weights for [Normal/Mild, Moderate, Severe] (competition convention)
class_weights: [1.0, 2.0, 4.0]

# model
backbone: "tf_efficientnet_b4"
pretrained: true
dropout: 0.2

# training
amp: true
scheduler: "cosine"
early_stopping_patience: 5

# cross-validation
n_folds: 5
fold_col: "fold"
target_col: "severity"  # expected column name in prepared training dataframe

# expected PNG routing
conditions:
  - spinal_canal_stenosis
  - neural_foraminal_narrowing
  - subarticular_stenosis
