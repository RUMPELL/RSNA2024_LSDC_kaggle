# configs/png_export.yaml
# This configuration matches the original notebook (save_crop-3ch.ipynb).

dicom:
  try_lut: true
  fix_monochrome: true
  clip_percentiles: [1.0, 99.0]

crop_rules:
  axial_scale: 0.13
  non_axial_scale: 0.20
  axial_min_small: 64
  axial_min_large: 112
  sagittal_offset_x_frac: -0.05
  sagittal_offset_y_frac: 0.05

# Column mapping for the crop-instruction CSV.
# One CSV row should describe ONE crop to export.
columns:
  study_id: study_id
  series_id: series_id
  instance_number: instance_number
  level: level
  series_description: series_description
  condition: condition
  x: x
  y: y
